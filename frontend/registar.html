<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta - Farmácia CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="js/config.js"></script>
<style>
:root{
    --paper:#faf9f6;
    --card:#ffffff;
    --ink:#14181a;
    --ink-soft:#5b6660;
    --line:#e2e5de;
    --green:#0e6b4f;
    --green-dim:rgba(14,107,79,0.10);
    --green-ring:rgba(14,107,79,0.22);
    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --display: 'Space Grotesk', var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
    font-family:var(--sans);
    color:var(--ink);
    background:linear-gradient(160deg, #f0faf6 0%, #eef5fb 50%, #fdf8ec 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
    overflow-x:hidden;
}

/* Canvas com capsulas/cruzes farmaceuticas a flutuar */
#cne-bg-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

/* Cartao e rodape ficam acima do canvas */
.card, .foot-note{position:relative; z-index:1;}

@keyframes entrarCartao{
    from{opacity:0; transform:translateY(16px) scale(0.985);}
    to{opacity:1; transform:translateY(0) scale(1);}
}
@media (prefers-reduced-motion: reduce){
    .card{animation:none !important;}
}

.card{
    width:100%;
    max-width:408px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 24px 60px -24px rgba(14,107,79,0.20), 0 2px 8px rgba(20,24,26,0.05);
    overflow:hidden;
    animation:entrarCartao 0.55s cubic-bezier(.16,.8,.3,1) both;
}

.card-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
}
.wordmark{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:var(--display);
    font-weight:600;
    font-size:15px;
    letter-spacing:-0.01em;
}
.wordmark .glyph{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    color:var(--green);
    flex-shrink:0;
}
.glyph-flag{
    width:24px;height:16px;
    border-radius:3px;
    overflow:hidden;
    border:1px solid rgba(20,24,26,0.12);
}
.glyph-flag svg{width:100%;height:100%;}
.strip-meta{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--ink-soft);
}

.card-body{
    padding:32px 28px 28px;
}

.heading{
    font-family:var(--display);
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin-bottom:6px;
}
.subheading{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:26px;
    line-height:1.5;
}

.field{margin-bottom:16px;}
.field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:7px;
    transition:color 0.15s;
}
.field:has(input:focus) label{color:var(--green);}
.input-wrap{position:relative;}
.input-wrap .field-icon{
    position:absolute;
    left:12px; top:50%;
    transform:translateY(-50%);
    width:16px;height:16px;
    color:#a7ada6;
    pointer-events:none;
    transition:color 0.15s;
    display:flex;
}
.input-wrap .field-icon svg{width:100%;height:100%;}
.field input{
    width:100%;
    padding:11px 13px 11px 38px;
    font-size:16px;
    font-family:var(--sans);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    transition:border-color 0.15s, box-shadow 0.15s;
}
.field input::placeholder{color:#a7ada6;}
.field input:focus{
    outline:none;
    border-color:var(--green);
    box-shadow:0 0 0 3px var(--green-ring);
}
.field input:focus ~ .field-icon{color:var(--green);}
.field-hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
}

.pwd-wrap{position:relative;}
.pwd-wrap input{padding-right:52px;}
.pwd-toggle{
    position:absolute;
    right:11px; top:50%;
    transform:translateY(-50%);
    background:none;border:none;
    cursor:pointer;
    color:var(--green);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.02em;
    padding:4px 2px;
    transition:opacity 0.15s;
}
.pwd-toggle:hover{opacity:0.7;}

.btn-primary{
    width:100%;
    padding:12px;
    background:var(--green);
    color:white;
    border:none;
    border-radius:8px;
    font-family:var(--display);
    font-size:13.5px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background 0.15s, transform 0.05s, box-shadow 0.15s;
    margin-top:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
.btn-primary:hover{background:#0a5640; box-shadow:0 6px 16px -6px rgba(14,107,79,0.45);}
.btn-primary:active{transform:scale(0.99);}
.btn-primary:disabled{opacity:0.7;cursor:default;}
.btn-primary:disabled:hover{box-shadow:none;}

.spinner{
    width:14px;height:14px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:girar 0.7s linear infinite;
    display:none;
}
.btn-primary.a-carregar .spinner{display:inline-block;}
@keyframes girar{to{transform:rotate(360deg);}}

@keyframes shake{
    10%,90%{transform:translateX(-1px);}
    20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
}
.error-box.shake{animation:shake 0.4s;}

.error-box{
    background:#fbf0ee;
    border:1px solid #eecac2;
    color:#9a3b23;
    font-size:13px;
    padding:10px 13px;
    border-radius:8px;
    margin-bottom:18px;
}
.success-box{
    background:var(--green-dim);
    border:1px solid var(--green-ring);
    color:var(--green);
    font-size:13px;
    padding:10px 13px;
    border-radius:8px;
    margin-bottom:18px;
}

.signup-note{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:20px;
}
.signup-note a{
    color:var(--green);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid var(--green-ring);
}
.signup-note a:hover{border-bottom-color:var(--green);}

@media (max-width: 420px){
    body{padding:20px 14px;}
    .card-strip{padding:14px 18px;}
    .card-body{padding:26px 20px 22px;}
    .heading{font-size:23px;}
    .strip-meta{display:none;}
}
</style>
</head>
<body>

<canvas id="cne-bg-canvas"></canvas>

<div class="card">
    <div class="card-strip">
        <div class="wordmark">
            <span class="glyph glyph-flag">
                <svg viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice"><rect width="900" height="600" fill="#003893"/>
<rect x="0" y="336.00" width="900" height="44.00" fill="#FFFFFF"/>
<rect x="0" y="380.00" width="900" height="44.00" fill="#CF142B"/>
<rect x="0" y="424.00" width="900" height="44.00" fill="#FFFFFF"/>
<polygon points="301.50,217.20 305.25,228.84 317.48,228.81 307.57,235.97 311.37,247.59 301.50,240.38 291.63,247.59 295.43,235.97 285.52,228.81 297.75,228.84" fill="#FFD100"/><polygon points="361.45,236.68 365.21,248.32 377.43,248.29 367.53,255.45 371.33,267.07 361.45,259.86 351.58,267.07 355.38,255.45 345.48,248.29 357.70,248.32" fill="#FFD100"/><polygon points="398.51,287.68 402.26,299.32 414.49,299.29 404.58,306.45 408.38,318.07 398.51,310.86 388.63,318.07 392.44,306.45 382.53,299.29 394.76,299.32" fill="#FFD100"/><polygon points="398.51,350.72 402.26,362.35 414.49,362.33 404.58,369.49 408.38,381.11 398.51,373.90 388.63,381.11 392.44,369.49 382.53,362.33 394.76,362.35" fill="#FFD100"/><polygon points="361.45,401.72 365.21,413.35 377.43,413.33 367.53,420.49 371.33,432.11 361.45,424.90 351.58,432.11 355.38,420.49 345.48,413.33 357.70,413.35" fill="#FFD100"/><polygon points="301.50,421.20 305.25,432.84 317.48,432.81 307.57,439.97 311.37,451.59 301.50,444.38 291.63,451.59 295.43,439.97 285.52,432.81 297.75,432.84" fill="#FFD100"/><polygon points="241.55,401.72 245.30,413.35 257.52,413.33 247.62,420.49 251.42,432.11 241.55,424.90 231.67,432.11 235.47,420.49 225.57,413.33 237.79,413.35" fill="#FFD100"/><polygon points="204.49,350.72 208.24,362.35 220.47,362.33 210.56,369.49 214.37,381.11 204.49,373.90 194.62,381.11 198.42,369.49 188.51,362.33 200.74,362.35" fill="#FFD100"/><polygon points="204.49,287.68 208.24,299.32 220.47,299.29 210.56,306.45 214.37,318.07 204.49,310.86 194.62,318.07 198.42,306.45 188.51,299.29 200.74,299.32" fill="#FFD100"/><polygon points="241.55,236.68 245.30,248.32 257.52,248.29 247.62,255.45 251.42,267.07 241.55,259.86 231.67,267.07 235.47,255.45 225.57,248.29 237.79,248.32" fill="#FFD100"/></svg>
            </span>
            Farmácia CV
        </div>
        <div class="strip-meta">NOVA CONTA</div>
    </div>

    <div class="card-body">
        <div class="heading">Criar conta</div>
        <p class="subheading">Preencha os seus dados para se registar.</p>
        <p class="subheading" style="font-size:13px;color:#1e8449;">🛒 A sua conta será de <strong>cliente</strong>, para poder fazer compras online.</p>

        <div id="erro" class="error-box" style="display:none;"></div>
        <div id="sucesso" class="success-box" style="display:none;"></div>

        <form id="formRegisto">
            <div class="field">
                <label for="nome">Nome completo</label>
                <div class="input-wrap">
                    <input type="text" id="nome" placeholder="O seu nome" autocomplete="name">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="3.5"/>
                            <path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <div class="input-wrap">
                    <input type="email" id="email" placeholder="nome@exemplo.cv" autocomplete="email">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6.5l9 6.5 9-6.5"/>
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="field">
                <label for="password">Palavra-passe</label>
                <div class="pwd-wrap input-wrap">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="10" width="16" height="10" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        </svg>
                    </span>
                    <button type="button" class="pwd-toggle" onclick="togglePwd('password','pwdToggleBtn')" id="pwdToggleBtn">VER</button>
                </div>
                <p class="field-hint">Mínimo de 4 caracteres.</p>
            </div>

            <div class="field">
                <label for="password2">Confirmar palavra-passe</label>
                <div class="pwd-wrap input-wrap">
                    <input type="password" id="password2" placeholder="••••••••" autocomplete="new-password">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="10" width="16" height="10" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        </svg>
                    </span>
                    <button type="button" class="pwd-toggle" onclick="togglePwd('password2','pwdToggleBtn2')" id="pwdToggleBtn2">VER</button>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="btnRegistar">
                <span class="spinner"></span>
                <span id="btnRegistarTexto">Criar conta</span>
            </button>
        </form>

        <p class="signup-note">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
</div>

<script>


function togglePwd(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    if (input.type === "password") {
        input.type = "text";
        btn.innerText = "OCULTAR";
    } else {
        input.type = "password";
        btn.innerText = "VER";
    }
}

document.getElementById("formRegisto").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nome      = document.getElementById("nome").value.trim();
    const email     = document.getElementById("email").value.trim();
    const password  = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    const erroBox    = document.getElementById("erro");
    const sucessoBox = document.getElementById("sucesso");
    const btn        = document.getElementById("btnRegistar");
    const btnTexto   = document.getElementById("btnRegistarTexto");

    function mostrarErro(msg) {
        erroBox.innerText = msg;
        erroBox.style.display = "block";
        erroBox.classList.remove("shake");
        void erroBox.offsetWidth;
        erroBox.classList.add("shake");
    }

    erroBox.style.display = "none";
    sucessoBox.style.display = "none";

    if (!nome || !email || !password) {
        mostrarErro("Preencha todos os campos.");
        return;
    }
    if (password.length < 4) {
        mostrarErro("A palavra-passe deve ter pelo menos 4 caracteres.");
        return;
    }
    if (password !== password2) {
        mostrarErro("As palavras-passe não coincidem.");
        return;
    }

    btn.disabled = true;
    btn.classList.add("a-carregar");
    btnTexto.innerText = "A criar conta...";

    try {
        const res = await fetch(`${API_URL}/registar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome, email, password })
        });

        const data = await res.json();

        if (!res.ok) {
            mostrarErro(data.detail || "Não foi possível criar a conta.");
            return;
        }

        sucessoBox.innerText = "Conta criada com sucesso! A redirecionar para o login...";
        sucessoBox.style.display = "block";
        document.getElementById("formRegisto").reset();

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1800);

    } catch (err) {
        mostrarErro("Erro de ligação com o servidor. Verifique se o backend está a correr.");
    } finally {
        btn.disabled = false;
        btn.classList.remove("a-carregar");
        btnTexto.innerText = "Criar conta";
    }
});

/* ── Fundo animado: capsulas e cruzes farmaceuticas a flutuar ────────── */
(function () {
    const canvas = document.getElementById("cne-bg-canvas");
    const ctx = canvas.getContext("2d");
    let w, h, itens;

    const VERDE = "14,107,79";
    const DOURADO = "201,164,92";
    const N_ITENS = 26;

    function redimensionar() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }

    function criarItens() {
        itens = Array.from({ length: N_ITENS }, () => criarItem(true));
    }

    function criarItem(posicaoInicialAleatoria) {
        const tipo = Math.random() < 0.55 ? "capsula" : "cruz";
        const cor = Math.random() < 0.75 ? VERDE : DOURADO;
        return {
            tipo,
            x: Math.random() * w,
            y: posicaoInicialAleatoria ? Math.random() * h : h + 40,
            tam: tipo === "capsula" ? (18 + Math.random() * 14) : (10 + Math.random() * 8),
            vy: 0.10 + Math.random() * 0.16,
            deriva: Math.random() * Math.PI * 2,
            velDeriva: 0.004 + Math.random() * 0.006,
            rot: Math.random() * Math.PI,
            velRot: (Math.random() - 0.5) * 0.003,
            opacidade: 0.06 + Math.random() * 0.10,
            cor
        };
    }

    function desenharCapsula(it) {
        const metade = it.tam / 2;
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rot);
        ctx.beginPath();
        ctx.roundRect(-metade * 1.9, -metade * 0.85, metade * 1.9, metade * 1.7, metade * 0.85);
        ctx.fillStyle = `rgba(${it.cor},${it.opacidade})`;
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(0, -metade * 0.85, metade * 1.9, metade * 1.7, metade * 0.85);
        ctx.fillStyle = `rgba(${it.cor},${it.opacidade * 0.55})`;
        ctx.fill();
        ctx.restore();
    }

    function desenharCruz(it) {
        const b = it.tam * 0.32;
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rot);
        ctx.fillStyle = `rgba(${it.cor},${it.opacidade})`;
        ctx.fillRect(-it.tam / 2, -b / 2, it.tam, b);
        ctx.fillRect(-b / 2, -it.tam / 2, b, it.tam);
        ctx.restore();
    }

    function passo() {
        ctx.clearRect(0, 0, w, h);

        for (const it of itens) {
            it.y -= it.vy;
            it.deriva += it.velDeriva;
            it.x += Math.sin(it.deriva) * 0.25;
            it.rot += it.velRot;

            if (it.tipo === "capsula") desenharCapsula(it);
            else desenharCruz(it);

            if (it.y < -40) Object.assign(it, criarItem(false));
        }

        requestAnimationFrame(passo);
    }

    redimensionar();
    criarItens();
    passo();

    window.addEventListener("resize", redimensionar);
})();
</script>
</body>
</html>
