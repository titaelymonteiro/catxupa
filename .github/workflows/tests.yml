name: Testes - Farmácia CV

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farmacia_api

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: farmacia_api/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Correr a suite de testes
        env:
          SECRET_KEY: chave-de-teste-do-ci-nao-usar-em-producao
        run: pytest
